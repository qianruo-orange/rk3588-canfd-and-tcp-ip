<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBC 信号解析</title>
<link rel="stylesheet" href="/css/common.css">
<script src="/js/theme.js"></script>
<style>
.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.top-bar .nav{margin:0 0 0 auto;display:flex;gap:14px}
.top-bar .theme-btn{position:static;margin-left:16px;flex:none}
.nav a{padding:6px 12px;border:1px solid var(--card-border2);border-radius:10px;background:var(--card-bg)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--card-border);white-space:nowrap}
th{color:var(--muted);font-weight:600}
td{color:var(--text)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.id{color:var(--accent)}
.name{color:var(--name)}
.sig{white-space:normal;word-break:break-all}
.empty{color:var(--muted-2);text-align:center;padding:32px}
.meta{color:var(--muted-2);font-size:12px;margin-top:8px}
.card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.filter{font-size:13px;color:var(--muted)}
.filter select{margin-left:6px;padding:5px 10px;border:1px solid var(--card-border2);border-radius:8px;background:var(--card-bg);color:var(--text)}
</style>
</head>
<body>
<div class="top-bar">
  <h1>DBC 信号解析</h1>
  <div class="nav">
    <a href="/">📊 仪表盘</a>
    <a href="/config">⚙ 配置</a>
    <a href="/logs">📁 文件下载</a>
  </div>
  <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" title="切换主题">🌙 主题</button>
</div>
<div class="card">
  <div class="card-head">
    <h3>最近解析的 CAN 信号</h3>
    <label class="filter">通道
      <select id="channel"><option value="">全部</option></select>
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>接口</th><th>ID</th><th>报文</th><th>信号值</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="empty">等待数据…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="meta" id="meta"></div>
</div>
<div class="card">
  <div class="card-head">
    <h3>最近发送的 CAN 信号（发送方向）</h3>
    <label class="filter">通道
      <select id="channel-tx"><option value="">全部</option></select>
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>接口</th><th>ID</th><th>报文</th><th>信号值</th></tr>
      </thead>
      <tbody id="rows-tx">
        <tr><td colspan="5" class="empty">等待数据…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="meta" id="meta-tx"></div>
</div>
<script src="/js/dbc.js"></script>
</body>
</html>
