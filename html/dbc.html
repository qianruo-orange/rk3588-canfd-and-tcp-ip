<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBC 信号解析</title>
<link rel="stylesheet" href="/css/common.css">
<style>
.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.nav{margin:14px 0;display:flex;gap:14px}
.nav a{padding:6px 12px;border:1px solid rgba(108,180,238,.2);border-radius:10px;background:rgba(16,29,51,.4)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid rgba(108,180,238,.12);white-space:nowrap}
th{color:#8b9ec4;font-weight:600}
td{color:#c8d6e5}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.id{color:#78c0f0}
.name{color:#4ce0b0}
.sig{white-space:normal;word-break:break-all}
.empty{color:#5b6b85;text-align:center;padding:32px}
.meta{color:#5b6b85;font-size:12px;margin-top:8px}
.card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.filter{font-size:13px;color:#8b9ec4}
.filter select{margin-left:6px;padding:5px 10px;border:1px solid rgba(108,180,238,.25);border-radius:8px;background:rgba(16,29,51,.5);color:#c8d6e5}
</style>
</head>
<body>
<div class="top-bar">
  <h1>DBC 信号解析</h1>
  <a href="/">← 返回仪表盘</a>
</div>
<div class="nav">
  <a href="/">📊 仪表盘</a>
  <a href="/config">⚙ 配置</a>
  <a href="/logs">📋 日志</a>
</div>
<div class="card">
  <div class="card-head">
    <h3>最近解析的 CAN 信号</h3>
    <label class="filter">通道
      <select id="channel"><option value="">全部</option></select>
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>接口</th><th>ID</th><th>报文</th><th>信号值</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="empty">等待数据…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="meta" id="meta"></div>
</div>
<div class="card">
  <div class="card-head">
    <h3>最近发送的 CAN 信号（发送方向）</h3>
    <label class="filter">通道
      <select id="channel-tx"><option value="">全部</option></select>
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>接口</th><th>ID</th><th>报文</th><th>信号值</th></tr>
      </thead>
      <tbody id="rows-tx">
        <tr><td colspan="5" class="empty">等待数据…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="meta" id="meta-tx"></div>
</div>
<script src="/js/dbc.js"></script>
</body>
</html>
