<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配置</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/config.css">
<script src="/js/theme.js"></script>
<script src="/js/auth.js"></script>
</head><body>
<div class="top"><h1> 配置</h1><div class="nav"><a href="/">📊 仪表盘</a><a href="/dbc">📡 DBC解析</a><a href="/logs">📁 文件下载</a></div><button type="button" class="btn btn-back" onclick="loadCfg()">🔄 查询</button><button id="themeBtn" class="theme-btn" onclick="toggleTheme()" title="切换主题">🌙 主题</button></div>

<form id="f">
<div class="can-grid">
<div class="card" id="card_can"><h3><select id="canSel" onchange="onCanSel()"></select> <span id="st"></span> <label class="toggle"><input type="checkbox" id="tg" onchange="toggleCan(this.checked)"><span class="slider"></span></label><button type="button" class="btn btn-save" style="margin-left:auto;padding:4px 14px" onclick="saveCan()">💾 保存</button></h3>
<div id="cfg">
<div class="cfg-grid">
<div class="row"><label>波特率</label><input name="br" id="br" type="number"><span class="unit">bps</span></div>
<div class="row"><label>CAN FD</label><select name="fd" id="fd" onchange="chkFd()"><option value="on">on</option><option value="off">off</option></select></div>
<div class="row" id="dbr"><label>FD波特率</label><input name="db" id="db" type="number"><span class="unit">bps</span></div>
</div>
<div class="filters">
<h4><span>CAN-ID 过滤器</span><button type="button" class="add-btn" onclick="addFilter()">+ 添加</button></h4>
<div id="fil"></div>
</div>
<div class="row"><label>DBC 文件</label><input type="file" id="dbc" accept=".dbc" style="flex:1"><button type="button" class="add-btn" onclick="uploadDbc()">上传</button></div>
</div><div class="hint" id="hint">接口已关闭，开启后可配置</div></div>

<div class="card" id="card_net"><h3>网络设置 <button type="button" class="btn btn-save" style="margin-left:auto;padding:4px 14px" onclick="saveNet()">💾 保存</button></h3>
<div class="tip">TCP 数据通道的网卡 / 端口 / IP 配置（供上位机连接传输 CAN 数据）；网页服务器固定 80 端口，不受此配置影响。</div>
<div class="row"><label>绑定网卡</label><select name="bind" id="bind"><option value="">所有网卡</option></select></div>
<div class="row"><label>TCP端口</label><input name="tp" id="tp" type="number"></div>
<div class="row"><label>最大客户端数</label><input name="mc" id="mc" type="number"></div>
<div class="row"><label>IP 模式</label><select id="ip_mode" onchange="chkIpMode()"><option value="">关闭（不管理）</option><option value="static">静态</option><option value="dhcp">DHCP</option></select></div>
<div class="row" id="ip_a_row"><label>IP 地址</label><input id="ip_a" type="text" placeholder="192.168.1.100"></div>
<div class="row" id="ip_m_row"><label>子网掩码</label><input id="ip_m" type="text" placeholder="255.255.255.0"></div>
<div class="row" id="ip_g_row"><label>网关</label><input id="ip_g" type="text" placeholder="192.168.1.1"></div>
<div class="ip-cur" id="ip_cur">当前未读取</div>
</div>

<div class="card" id="card_video"><h3>视频 <button type="button" class="btn btn-save" style="margin-left:auto;padding:4px 14px" onclick="saveVideo()">💾 保存</button></h3>
<div class="row"><label>设备</label><select name="vd" id="vd" onchange="queryCaps()"><option value="">-- 扫描中 --</option></select></div>
<div class="row"><label>格式 / 分辨率</label><select name="vr" id="vr" onchange="onResChange()"><option value="">-- 请选择设备 --</option></select></div>
<input type="hidden" id="vw"><input type="hidden" id="vh">
</div>
</div>
<div id="msg"></div>
</form>

<script src="/js/config.js"></script>
</body></html>
